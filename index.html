<title>Merugu — 3D Portfolio (Sample)</title>
<!--
  Prabha1, rewritten minimal at Dinesh's order: ONLY water, boat and dragon.
  No scroll (the page cannot scroll; the only motion is the boat), no gate, no scenery.

  Sky + water: FOLIO's own assets, used directly (Dinesh's order) —
    sky:   assets/sky.hdr, the Poly Haven kloofendal partly-cloudy HDRI folio
           loads, on a backside sphere at folio's day rotation + environment;
    water: three's classic mirror Water with folio's simple/waternormals.jpeg
           and folio's settings (2048 reflection, distortionScale 3).
  Boat + boatman: Sakura Fantasy by Bill Chan (MIT) —
    boat:  boat/boat.glb (tomabune) + boat/boatman.glb, rigged per frame by their
           figures.js createBoatman solver and boat.js sculling logic;
    shared material patch system: lib/sakura/shared.js.
  Boatman figure body: MPFB / MakeHuman (CC0). three.js r160 (MIT).
-->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1622; overscroll-behavior: none; }
  body { position: fixed; inset: 0; font-family: Georgia, 'Times New Roman', serif; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; }
  #veil { position: fixed; inset: 0; z-index: 50; background: #0d1622; display: flex; flex-direction: column;
          align-items: center; justify-content: center; gap: 10px; color: #cfe0ee; transition: opacity .9s; }
  #veil .t { font-size: 15px; letter-spacing: .5em; text-transform: uppercase; }
  #veil .s { font-size: 12px; letter-spacing: .18em; color: #7e97ac; font-style: italic; }
  #veil.gone { opacity: 0; pointer-events: none; }
  #hint { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 9998; color: #eaf2f8;
          background: rgba(10,18,28,.38); border: 1px solid rgba(255,255,255,.22); padding: 6px 14px;
          border-radius: 999px; font-size: 13px; letter-spacing: .06em; pointer-events: none;
          transition: opacity .6s; white-space: nowrap; }
  @media (pointer: coarse) { #hint { bottom: 92px; } }
  #credit { position: fixed; right: 12px; bottom: 10px; z-index: 9997; pointer-events: none;
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 11px; letter-spacing: .05em;
    color: rgba(220, 238, 246, .78); background: rgba(13, 48, 80, .45);
    border: 1px solid rgba(179, 211, 224, .3); padding: 4px 10px; border-radius: 999px; }
  @media (pointer: coarse) { #credit { bottom: 92px; } }
</style>

<body>
<div id="veil"><div class="t">Merugu</div><div class="s">launching the boat…</div></div>

<script type="importmap">{"imports":{

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { KTX2Loader } from 'three/addons/loaders/KTX2Loader.js';
import { MeshoptDecoder } from './lib/addons/libs/meshopt_decoder.module.js';
import { U, UNIFORMS_GLSL, NOISE, ATMOS, patch } from './lib/sakura/shared.js';
import { createBoatman } from './lib/sakura/figures.js';
import { Water } from './lib/addons/objects/Water.js';
import { RGBELoader } from './lib/addons/loaders/RGBELoader.js';
const LAYER_WATER = 1;

window.__boatStatus = 'loading';

/* ================= renderer / scene / camera ================= */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.22;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 6000);
camera.layers.enable(LAYER_WATER);           // layer 0 (boat, sky) + layer 1 (water)
camera.position.set(-9, 3.2, -10);
scene.add(camera);

/* ================= the day state (shared Sakura uniforms) =================
   One calm blue-grey day, sun warm from the side; these uniforms drive the
   water, the sky and the boat's patched materials together. */
const SUN_DIR = new THREE.Vector3(0.45, 0.62, 0.30).normalize();
U.uSunDir.value.copy(SUN_DIR); U.uTrueSun.value.copy(SUN_DIR); U.uMoonDir.value.copy(SUN_DIR);
U.uSunCol.value.set(3.3, 3.0, 2.5);
U.uSkyZen.value.set(0.17, 0.40, 0.85); U.uSkyHor.value.set(0.68, 0.80, 0.95);
U.uAmbUp.value.set(0.58, 0.66, 0.74); U.uAmbDown.value.set(0.16, 0.15, 0.13);
U.uFogSun.value.set(1.0, 0.86, 0.64); U.uFogAway.value.set(0.58, 0.70, 0.86);
U.uFogParams.value.set(0.0011, 0.010, 0.030, 0);   // haze so the sheet's far edge melts into the sky
U.uMist.value = 0.35; U.uLampOn.value = 1; U.uSeason.value.set(0, 0, 0, 0);
U.uWind.value.set(0.6, -0.8, 0.5, 0);
U.uLampPos.value[0].set(0, -999, 0, 7); U.uLampCol.value[0].set(2.2, 1.1, 0.4);  // the boat's lantern

/* lights for the boat's standard materials (the water and sky are shaders) */
scene.add(new THREE.HemisphereLight(0xbfd9ea, 0x2e4a66, 0.95));
const sun = new THREE.DirectionalLight(0xfff1da, 2.3);
sun.position.copy(SUN_DIR).multiplyScalar(90);
scene.add(sun);

/* ================= sky: FOLIO'S OWN SKY, used directly =================
   The exact HDRI folio loads — Poly Haven kloofendal_48d_partly_cloudy
   (CC0), assets/sky.hdr — on a backside sphere, tone mapping off, at
   folio's day rotation; it also lights the scene as the environment. */
const skyTex = new RGBELoader().load('./assets/sky.hdr', t => {
  t.mapping = THREE.EquirectangularReflectionMapping;
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromEquirectangular(t).texture;
});
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(2800, 64, 64),
  new THREE.MeshBasicMaterial({ side: THREE.BackSide, toneMapped: false, map: skyTex, fog: false })
);
sky.rotation.y = Math.PI / 2.6;   // folio's day-mode rotation
sky.frustumCulled = false;
scene.add(sky);

/* ================= water: FOLIO'S WATER assets + values =================
   three's classic mirror Water wearing folio's own waternormals.jpeg and
   folio's settings (2048 reflection, distortionScale 3, timeScale 0.5). */
const waterNormals = new THREE.TextureLoader().load('./assets/waternormals.jpeg', t => {
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
});
const waterMesh = new Water(new THREE.PlaneGeometry(2400, 2400), {
  textureWidth: 2048, textureHeight: 2048,
  waterNormals,
  sunDirection: SUN_DIR.clone(), sunColor: 0xffffff,
  waterColor: 0x0a4a7a, distortionScale: 3, fog: false,
});
waterMesh.rotation.x = -Math.PI / 2;
waterMesh.material.uniforms.size.value = 2.5;
scene.add(waterMesh);
/* Stubs for the wake bookkeeping in step() — the classic water has no wake
   uniforms; the writes land here harmlessly. reflection is gone too: the
   classic Water renders its own mirror pass internally. */
const water = { uniforms: {
  uWake: { value: Array.from({ length: 16 }, () => new THREE.Vector4(0, -99999, -1e3, 0)) },
  uEddy: { value: Array.from({ length: 8 }, () => new THREE.Vector4(0, -99999, -1e3, 0)) },
  uOar: { value: new THREE.Vector4(0, -99999, 0, -99999) },
  uBoatInv: { value: new THREE.Matrix4() },
  uRes: { value: new THREE.Vector2(1, 1) },
} };
const reflection = null;

/* ================= the boat (Sakura tomabune + boatman) ================= */
const glowC = document.createElement('canvas'); glowC.width = glowC.height = 128;
{
  const gx = glowC.getContext('2d'), grd = gx.createRadialGradient(64, 64, 2, 64, 64, 64);
  grd.addColorStop(0, 'rgba(255,150,50,.85)'); grd.addColorStop(.4, 'rgba(255,110,30,.28)'); grd.addColorStop(1, 'rgba(255,110,30,0)');
  gx.fillStyle = grd; gx.fillRect(0, 0, 128, 128);
}
const glowTex = new THREE.CanvasTexture(glowC);

function boatMaterial(m) { // from Sakura boat.js: wet dark band below the waterline (y = 0 here)
  m.aoMapIntensity = 0.75;
  patch(m, { key: 'boat-' + m.name, snow: m.name.includes('toma') || m.name.includes('straw') ? 1.2 : 1, wet: 0.8,
    hooks: { map: `{ vec3 nw=inverseTransformDirection(normalize(vNormal),viewMatrix);
        vec2 rt=vec2(cos(uBoat.z),-sin(uBoat.z));
        float out_=max(step(0.3,dot(nw.xz,rt)*sign(dot(vSfWP.xz-uBoat.xy,rt))),step(0.5,-nw.y));
        float wl=smoothstep(0.09,-0.03,vSfWP.y)*out_;
        diffuseColor.rgb*=mix(vec3(1.0),vec3(0.4,0.46,0.36),wl); sfHullWet=wl; }`,
      normal: 'roughnessFactor = mix(roughnessFactor, roughnessFactor * 0.4, sfHullWet);' },
    fragHead: 'float sfHullWet = 0.0;' });
  return m;
}
function paperMaterial(m) { // from Sakura boat.js: lit washi, the flame glows through
  patch(m, { key: 'boat-paper', snow: 0.3, wet: 0.4,
    hooks: { preLight: `{ float tr=dot(diffuseColor.rgb,vec3(0.3333));
        float g=uLampOn*smoothstep(0.25,0.7,tr);
        diffuseColor.rgb=mix(diffuseColor.rgb,diffuseColor.rgb*0.4,uLampOn*0.6);
        totalEmissiveRadiance+=vec3(1.0,0.52,0.2)*g*2.6*(0.88+0.12*sin(uTime*7.0+vSfWP.x*3.0)); }` } });
  return m;
}

const boatState = {
  pos: new THREE.Vector3(0, 0, 0), heading: 2.6, speed: 0,
  driving: false, turnLean: 0, pitch: 0,
};
window.__boatState = boatState;

const boatG = new THREE.Group();
scene.add(boatG);
let broot = null, oarPivot = null, man = null, rowerG = null, boatLampLight = null, boatReady = false, boatPhase = 0;
const ROWER = new THREE.Vector3(-0.03, -0.0355, -3.12);
const GRIPV = new THREE.Vector3(0, 0.4, 0.93), LOOMV = new THREE.Vector3(0, 0.28, 0.66);
const _g = new THREE.Vector3(), _g2 = new THREE.Vector3(), _gw = new THREE.Vector3(), _gw2 = new THREE.Vector3(), _fwd = new THREE.Vector3();
const _qr = new THREE.Quaternion(), _qHands = new THREE.Quaternion(), _bw = new THREE.Vector3();

async function loadBoat() {
  const ktx2 = new KTX2Loader().setTranscoderPath('./lib/basis/').detectSupport(renderer);
  const gltf = new GLTFLoader().setKTX2Loader(ktx2).setMeshoptDecoder(MeshoptDecoder);
  const [bg, mg] = await Promise.all([
    gltf.loadAsync('./boat/boat.glb'),
    gltf.loadAsync('./boat/boatman.glb')
  ]);
  broot = new THREE.Group(); boatG.add(broot);
  const src = bg.scene;
  src.traverse(o => { if (o.isMesh) { o.userData.boatPart = true; o.frustumCulled = false;
    if (o.material.name === 'paper') paperMaterial(o.material); else boatMaterial(o.material); } });
  const hullNode = src.getObjectByName('hull'), roNode = src.getObjectByName('ro'), lanternNode = src.getObjectByName('lantern');
  broot.add(hullNode, lanternNode);
  oarPivot = new THREE.Group(); oarPivot.add(roNode); oarPivot.position.set(0.42, 0.62, -3.85); broot.add(oarPivot);
  rowerG = new THREE.Group(); rowerG.position.copy(ROWER); rowerG.rotation.y = 1.25; broot.add(rowerG);
  try {
    man = createBoatman(mg.scene);
    rowerG.add(man.root);
  } catch (e) {
    /* A visible human matters more than the rowing animation: if the IK
       solver ever fails on a device, mount the figure as-is, statically. */
    console.warn('[prabha1] boatman solver failed — static figure fallback', e);
    man = null;
    rowerG.add(mg.scene);
  }
  /* Skinned figure meshes carry a bind-pose bounding sphere; never let the
     moving camera frustum-cull him out of his own boat. */
  mg.scene.traverse(o => { if (o.isMesh) o.frustumCulled = false; });
  if (lanternNode) {
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: 0.8 }));
    sp.scale.set(9, 9, 1); lanternNode.add(sp);
    boatLampLight = new THREE.PointLight(0xff9440, 1.2, 3, 2); lanternNode.add(boatLampLight);
  }
  boatReady = true;
  window.__boatStatus = 'loaded';
  document.getElementById('veil').classList.add('gone');
}

/* ================= input: keyboard, drag-look, wheel zoom, touch ================= */
const keys = { fwd: false, rev: false, left: false, right: false };
const chase = { init: false, pos: new THREE.Vector3(), look: new THREE.Vector3() };
function engage() {
  if (!boatState.driving) {
    boatState.driving = true;
    chase.init = false;
    const hint = document.getElementById('hint');
    if (hint) hint.style.opacity = '0.35';
    console.log('[prabha1] driving engaged');
  }
}
const KEYMAP = { KeyW: 'fwd', ArrowUp: 'fwd', KeyS: 'rev', ArrowDown: 'rev', KeyA: 'left', ArrowLeft: 'left', KeyD: 'right', ArrowRight: 'right' };
window.addEventListener('keydown', e => {
  const k = KEYMAP[e.code];
  if (!k) return;
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
  keys[k] = true; engage();
  e.preventDefault();
});
window.addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) keys[k] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

/* drag = look around (never scrolls the page: the page cannot scroll) */
const view = { yaw: 0, pitch: 0, dist: 10.5 };
{
  const el = renderer.domElement;
  let dragging = false, lx = 0, ly = 0;
  el.addEventListener('pointerdown', e => {
    dragging = true; lx = e.clientX; ly = e.clientY;
    try { el.setPointerCapture(e.pointerId); } catch (err) { /* older engines */ }
  });
  el.addEventListener('pointermove', e => {
    if (!dragging) return;
    view.yaw -= (e.clientX - lx) * 0.0052;
    view.pitch = THREE.MathUtils.clamp(view.pitch + (e.clientY - ly) * 0.004, -0.35, 0.9);
    lx = e.clientX; ly = e.clientY;
  });
  const end = () => { dragging = false; };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
  el.addEventListener('wheel', e => {
    e.preventDefault();
    view.dist = THREE.MathUtils.clamp(view.dist * Math.exp(e.deltaY * 0.001), 7, 18);
  }, { passive: false });
  el.addEventListener('contextmenu', e => { e.preventDefault(); });
}
/* belt and braces: no gesture may scroll or zoom the page itself */
document.addEventListener('touchmove', e => { e.preventDefault(); }, { passive: false });
document.addEventListener('gesturestart', e => { e.preventDefault(); });

function buildTouchUI() {
  if (document.getElementById('boat-touch')) return;
  const wrap = document.createElement('div');
  wrap.id = 'boat-touch';
  wrap.style.cssText = 'position:fixed;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom, 0px));z-index:99999;display:flex;justify-content:space-between;padding:0 18px;pointer-events:none;font-family:Georgia,serif;touch-action:none;';
  const mk = (label, key) => {
    const b = document.createElement('button');
    b.textContent = label;
    b.setAttribute('aria-label', 'boat ' + key);
    b.style.cssText = 'pointer-events:auto;width:58px;height:58px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(10,18,28,.42);color:#eaf2f8;font-size:22px;backdrop-filter:blur(3px);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;';
    /* One held-set per button, fed by BOTH pointer events and raw touch
       events, released only when every pointer/touch holding it is gone —
       the pattern that finally worked on the real phone (no pointerleave
       releases, explicit capture, gestures blocked on the button itself).
       Multi-touch works: hold ▲ and ◀ together. */
    const held = new Set();
    const sync = () => { keys[key] = held.size > 0; if (keys[key]) engage(); };
    b.addEventListener('pointerdown', e => {
      e.preventDefault();
      try { b.setPointerCapture(e.pointerId); } catch (err) { /* older engines */ }
      held.add('p' + e.pointerId); sync();
    });
    const release = e => { held.delete('p' + e.pointerId); sync(); };
    b.addEventListener('pointerup', release);
    b.addEventListener('pointercancel', release);
    b.addEventListener('touchstart', e => {
      e.preventDefault(); e.stopPropagation();
      for (const t of e.changedTouches) held.add('t' + t.identifier);
      sync();
    }, { passive: false });
    const tend = e => {
      e.preventDefault();
      for (const t of e.changedTouches) held.delete('t' + t.identifier);
      sync();
    };
    b.addEventListener('touchend', tend, { passive: false });
    b.addEventListener('touchcancel', tend, { passive: false });
    b.addEventListener('touchmove', e => { e.preventDefault(); }, { passive: false });
    b.addEventListener('contextmenu', e => { e.preventDefault(); });
    return b;
  };
  const left = document.createElement('div');
  left.style.cssText = 'display:flex;gap:12px;';
  left.append(mk('◀', 'left'), mk('▶', 'right'));
  const right = document.createElement('div');
  right.style.cssText = 'display:flex;gap:12px;';
  right.append(mk('▲', 'fwd'), mk('▼', 'rev'));
  wrap.append(left, right);
  document.body.appendChild(wrap);
}
/* Show the touch controls on any device that can touch — and regardless of
   detection, build them the first time a real touch lands anywhere. */
function armTouchUI() {
  const coarse = (window.matchMedia && matchMedia('(pointer: coarse)').matches)
    || ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  if (coarse) { buildTouchUI(); return; }
  window.addEventListener('touchstart', function once() {
    window.removeEventListener('touchstart', once);
    buildTouchUI();
  }, { capture: true, passive: true });
}
{
  const hint = document.createElement('div');
  hint.id = 'hint';
  const coarse = (window.matchMedia && matchMedia('(pointer: coarse)').matches) || navigator.maxTouchPoints > 0;
  hint.textContent = coarse ? '🛶  Touch the arrows — drive the boat' : '🛶  Drive: WASD / arrows / touch';
  document.body.appendChild(hint);
  armTouchUI();
}

/* ================= wake / oar state for the water ================= */
const WAKE_STEP = 4.5, BOW_Z = 2.6;
const wake = Array.from({ length: 16 }, () => new THREE.Vector4(0, -99999, -1e3, 0));
const eddies = Array.from({ length: 8 }, () => new THREE.Vector4(0, -99999, -1e3, 0));
let eddyI = 0, lastTurn = 0, odo = 0;
const oarW = new THREE.Vector4(0, -99999, 0, -99999);
const LOOM_TOP = new THREE.Vector3(0, 0, 0), LOOM_KNEE = new THREE.Vector3(0, -0.6, -1.7),
      LOOM_END = new THREE.Vector3(0, -1.25, -3.1), BLADE = new THREE.Vector3(0, -1.1, -2.8);
const _oa = new THREE.Vector3(), _oe = new THREE.Vector3();
const _m4 = new THREE.Matrix4(), _fwdV = new THREE.Vector3(), _desired = new THREE.Vector3(), _lookT = new THREE.Vector3();
const BOUND_R = 700;   // soft open-water bound: speed bleeds off and the sheet is clamped at r = 700

/* ================= per-frame ================= */
const clock = new THREE.Clock();
let wt = 0;
window.__frames = 0;

function step(dt, t) {
  const S = boatState;
  /* --- physics: throttle, drag, rudder (from the folio boat add-on) --- */
  const accel = keys.fwd ? 2.4 : keys.rev ? -1.7 : 0;
  S.speed += accel * dt;
  S.speed -= S.speed * 0.55 * dt;
  S.speed = THREE.MathUtils.clamp(S.speed, -2.5, 7.5);
  if (!keys.fwd && !keys.rev && Math.abs(S.speed) < 0.02) S.speed = 0;
  const turnIn = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  const flow = THREE.MathUtils.clamp(S.speed / 3, -1, 1);
  S.heading -= turnIn * 1.05 * flow * dt;
  _fwdV.set(Math.sin(S.heading), 0, Math.cos(S.heading));
  S.pos.addScaledVector(_fwdV, S.speed * dt);
  /* --- soft round bound --- */
  const rr = Math.hypot(S.pos.x, S.pos.z);
  if (rr > BOUND_R) {
    S.pos.multiplyScalar(BOUND_R / rr);
    S.speed *= 0.94;
  } else if (rr > BOUND_R - 40) {
    S.speed *= 1 - 0.25 * dt * (1 - (BOUND_R - rr) / 40);
  }
  /* --- hull motion: bob, turn lean, throttle pitch --- */
  S.turnLean += ((turnIn * THREE.MathUtils.clamp(Math.abs(S.speed) / 7, 0, 1) * 0.055) - S.turnLean) * Math.min(1, dt * 4);
  S.pitch += (((keys.fwd ? -0.012 : keys.rev ? 0.01 : 0)) - S.pitch) * Math.min(1, dt * 3);
  boatG.position.set(S.pos.x, Math.sin(t * 0.9) * 0.06 + Math.abs(S.speed) * 0.008, S.pos.z);
  boatG.rotation.set(
    Math.sin(t * 0.8 + 0.7) * 0.006 + S.pitch,
    S.heading,
    Math.sin(t * 0.7) * 0.008 - S.turnLean
  );
  boatG.updateMatrixWorld(true);

  /* --- sculling rig + boatman (Sakura boat.js update, adapted) --- */
  U.uTime.value = t;
  if (boatReady && broot) {
    const speed = 0.6 + Math.abs(S.speed) * 0.55;
    boatPhase += dt * (0.65 + Math.min(speed, 8) * 0.12) * 2.2;
    const sw = Math.sin(boatPhase);
    oarPivot.rotation.set(0.04 * Math.sin(boatPhase * 2), 0.3 * sw, 0.28 * Math.cos(boatPhase), 'YXZ');
    oarPivot.updateMatrix();
    _g.copy(GRIPV).applyMatrix4(oarPivot.matrix);
    _g2.copy(LOOMV).applyMatrix4(oarPivot.matrix);
    const f = rowerG.rotation.y; _fwd.set(Math.sin(f), 0, Math.cos(f));
    const hipShift = 0.05 * sw;
    const ahead = (_g.x - ROWER.x) * _fwd.x + (_g.z - ROWER.z) * _fwd.z - hipShift;
    const lean = Math.min(0.35, Math.max(-0.12, (ahead - 0.49) * 0.9));
    broot.updateMatrixWorld(true);
    broot.localToWorld(_gw.copy(_g)); broot.localToWorld(_gw2.copy(_g2));
    broot.getWorldQuaternion(_qr);
    _qHands.copy(_qr).multiply(oarPivot.quaternion).multiply(_qr.invert());
    if (man) {
      try {
        man.pose({ shift: hipShift, dip: 0.015 * Math.abs(sw), lean, turn: 0.1 * sw, grips: [_gw, _gw2], hands: _qHands,
          look: [-lean * 0.8 + 0.04 * Math.sin(t * 0.4), -0.95 + 0.25 * Math.sin(t * 0.13), 0] });
      } catch (e) {
        if (!step.poseWarned) { step.poseWarned = true; console.warn('[prabha1] boatman pose failed — keeping bind pose', e); }
      }
    }
    /* lantern into the shared lamp slot (feeds the hull/paper patches AND the water's glint column) */
    _bw.set(0, 1.82, 4.18).applyMatrix4(broot.matrixWorld);
    U.uLampPos.value[0].set(_bw.x, _bw.y, _bw.z, 7);
    if (boatLampLight) boatLampLight.intensity = 1.15 + Math.sin(t * 7.3) * 0.18;

    /* --- oar + wake for the water shader (Sakura boat.js bookkeeping) --- */
    const roNode = oarPivot.children[0];
    if (roNode) {
      roNode.updateWorldMatrix(true, false);
      _oa.copy(LOOM_TOP).applyMatrix4(roNode.matrixWorld);
      _oe.copy(LOOM_KNEE).applyMatrix4(roNode.matrixWorld);
      if (_oe.y > 0) { _oa.copy(_oe); _oe.copy(LOOM_END).applyMatrix4(roNode.matrixWorld); }
      const wet = _oa.y / Math.max(_oa.y - _oe.y, 1e-3);
      oarW.x = _oa.x + (_oe.x - _oa.x) * wet;
      oarW.y = _oa.z + (_oe.z - _oa.z) * wet;
      _oe.copy(BLADE).applyMatrix4(roNode.matrixWorld);
      oarW.z = _oe.x; oarW.w = _oe.z;
      const turn = Math.sign(Math.cos(boatPhase));
      if (turn !== lastTurn && lastTurn !== 0) {
        eddies[eddyI].set(_oe.x, _oe.z, t, lastTurn);
        eddyI = (eddyI + 1) % eddies.length;
      }
      lastTurn = turn;
    }
    odo += S.speed * dt;
    const bx = S.pos.x + Math.sin(S.heading) * BOW_Z, bz = S.pos.z + Math.cos(S.heading) * BOW_Z;
    if (Math.hypot(bx - wake[1].x, bz - wake[1].y) > WAKE_STEP * 4) {
      for (const w of wake) w.set(bx, bz, t - 1e3, odo);
    } else if (odo - wake[1].w >= WAKE_STEP) {
      for (let i = wake.length - 1; i > 1; i--) wake[i].copy(wake[i - 1]);
      wake[1].set(bx, bz, t, odo);
    }
    wake[0].set(bx, bz, t, odo);
    for (let i = 0; i < 16; i++) water.uniforms.uWake.value[i].copy(wake[i]);
    for (let i = 0; i < 8; i++) water.uniforms.uEddy.value[i].copy(eddies[i]);
    water.uniforms.uOar.value.copy(oarW);
  }
  /* hull data for the water + the patched boat materials */
  _m4.makeRotationY(S.heading).setPosition(S.pos.x, 0, S.pos.z);
  water.uniforms.uBoatInv.value.copy(_m4).invert();
  U.uBoat.value.set(S.pos.x, S.pos.z, S.heading, S.speed / 4);
  U.uViewPos.value.copy(camera.position);

  /* --- camera: idle drift orbit, chase while driving --- */
  if (S.driving) {
    if (!chase.init) { chase.pos.copy(camera.position); chase.look.copy(S.pos); chase.init = true; }
    const ch = S.heading + view.yaw;
    _desired.set(
      S.pos.x - Math.sin(ch) * view.dist,
      Math.max(1.7, 4.2 + view.pitch * 6),
      S.pos.z - Math.cos(ch) * view.dist
    );
    chase.pos.lerp(_desired, 1 - Math.exp(-2.8 * dt));
    camera.position.copy(chase.pos);
    _lookT.copy(S.pos); _lookT.y = 1.2;
    chase.look.lerp(_lookT, 1 - Math.exp(-4 * dt));
    camera.lookAt(chase.look);
  } else {
    const a = 0.85 + t * 0.045 + view.yaw;
    const r = view.dist + 1.0;
    camera.position.set(
      S.pos.x + Math.sin(a) * r,
      Math.max(1.7, 3.1 + view.pitch * 6),
      S.pos.z + Math.cos(a) * r
    );
    _lookT.copy(S.pos); _lookT.y = 1.1;
    camera.lookAt(_lookT);
  }
  camera.updateMatrixWorld();
}

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  const db = renderer.getDrawingBufferSize(new THREE.Vector2());
  water.uniforms.uRes.value.set(db.x, db.y);
  if (reflection) {
    const scale = Math.min(1, 2048 / Math.max(db.x, db.y));
    reflection.setSize(Math.max(2, Math.round(db.x * scale)), Math.max(2, Math.round(db.y * scale)));
  }
}
addEventListener('resize', resize);
resize();

/* ================= CHINESE DRAGON (Sketchfab — ok100, CC BY) =================
   The dragon escorts THE BOAT on a boat-aligned racetrack: it runs ahead
   along one side of the boat, rounds the front, comes back along the
   other side passing near the boat, rounds the back, repeat — skimming
   the water the whole way (height ~3, band ~1.8–4.2) so it passes
   through the surface zone right beside the boat instead of circling
   unseen overhead. The track's centre and heading ease after the boat,
   so it swings smoothly when the boat turns. Loading starts in parallel
   with the scene and stays fully non-fatal: if the load fails, the sea
   simply has no dragon. */
const DRAGON_HEADING_OFFSET = 0;   /* if the dragon ever flies tail-first on the phone check, flip this to Math.PI — one-line fix */
const DRAGON_OFF = 11;                          // lateral offset of the straights from the boat's axis
const DRAGON_REACH = 48;                        // straights run from 48 behind the boat to 48 ahead
const DRAGON_SPEED = 7;                         // units/s along the track — one lap ≈ 37 s (Dinesh: slow, we should FEEL it passing)
const DRAGON_H = -6.0, DRAGON_DIVE = 1.5;       // DIVE IN + COME OUT (Dinesh): origin swings -7.5 (body under, through the water) … -4.5 (emerging); the pitch comes from aiming the look target at the height ~1.2 s ahead in the cycle — nose-down going in, nose-up coming out
const DRAGON_STRAIGHT = DRAGON_REACH * 2;                   // 96
const DRAGON_CAP = Math.PI * DRAGON_OFF;                    // semicircle arc ≈ 34.6
const DRAGON_LAP = DRAGON_STRAIGHT * 2 + DRAGON_CAP * 2;    // ≈ 261.1
let dragonG = null, dragonMixer = null, dragonT0 = -1;
let dragonS = DRAGON_REACH;   // arc-length position — starts abeam of the boat on the forward straight, in the camera's forward view
let dragonHeading = null, dragonBank = 0;
const _dCenter = new THREE.Vector3(0, 0, 0);   // eased track centre — follows the boat
const _dNext = new THREE.Vector3();
const _dLocal = new THREE.Vector2(), _dLocalN = new THREE.Vector2();

/* One point of the racetrack in boat-local space (x = lateral, y = fore/aft).
   Returns true while the point is on one of the end caps (for banking). */
function dragonTrackPoint(s, out) {
  s = ((s % DRAGON_LAP) + DRAGON_LAP) % DRAGON_LAP;
  if (s < DRAGON_STRAIGHT) {                    // forward straight, starboard side
    out.set(DRAGON_OFF, -DRAGON_REACH + s); return false;
  }
  s -= DRAGON_STRAIGHT;
  if (s < DRAGON_CAP) {                         // front cap
    const p = s / DRAGON_OFF;
    out.set(DRAGON_OFF * Math.cos(p), DRAGON_REACH + DRAGON_OFF * Math.sin(p)); return true;
  }
  s -= DRAGON_CAP;
  if (s < DRAGON_STRAIGHT) {                    // return straight, port side
    out.set(-DRAGON_OFF, DRAGON_REACH - s); return false;
  }
  s -= DRAGON_STRAIGHT;                         // back cap
  const p = s / DRAGON_OFF;
  out.set(-DRAGON_OFF * Math.cos(p), -DRAGON_REACH - DRAGON_OFF * Math.sin(p)); return true;
}

async function loadDragon() {
  /* load in parallel with the scene from the start — no waiting on the boat */
  const ktx2 = new KTX2Loader().setTranscoderPath('./lib/basis/').detectSupport(renderer);
  const gltf = new GLTFLoader().setKTX2Loader(ktx2).setMeshoptDecoder(MeshoptDecoder);
  const dg = await gltf.loadAsync('./models/chinese_dragon.glb');
  const model = dg.scene;
  model.traverse(o => { if (o.isMesh) o.frustumCulled = false; });   // never cull it mid-circle
  /* normalise: longest axis -> ~30 units, bounding-box centre -> group origin */
  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3());
  const s = 30 / Math.max(size.x, size.y, size.z, 0.001);
  const centre = box.getCenter(new THREE.Vector3());
  model.scale.setScalar(s);
  model.position.copy(centre).multiplyScalar(-s);
  /* NO pitch: the bind pose stands vertical (Y span ±15) but the built-in
     clip plays the body HORIZONTAL — screenshots proved a pitch rotates
     the animated pose upright (a rearing wall). The clip is the truth;
     only the group height was wrong (see DRAGON_H). */
  dragonG = new THREE.Group();
  dragonG.add(model);
  scene.add(dragonG);
  if (dg.animations && dg.animations.length) {
    dragonMixer = new THREE.AnimationMixer(model);
    const act = dragonMixer.clipAction(dg.animations[0]);
    act.timeScale = 0.55; act.play();   // slow, heavy undulation to match the slow passes (LoopRepeat is the default)
  }
  window.__dragonStatus = 'flying';
  console.log('[portfolio] dragon escorting the boat');
}
loadDragon().catch(e => { window.__dragonStatus = 'skipped'; console.warn('[portfolio] dragon skipped', e); });

function updateDragon(t, dt) {
  if (!dragonG) return;
  if (dragonMixer) dragonMixer.update(Math.min(dt, 0.05));
  if (dragonT0 < 0) dragonT0 = t;              // the dragon's own clock starts when it appears
  const lt = t - dragonT0;
  /* the track's centre chases the boat, eased so it never jitters */
  const k = 1 - Math.exp(-3 * dt);
  _dCenter.x += (boatState.pos.x - _dCenter.x) * k;
  _dCenter.z += (boatState.pos.z - _dCenter.z) * k;
  /* …and the track's heading eases after the boat's heading (wraparound-safe) */
  if (dragonHeading === null) dragonHeading = boatState.heading;
  let dh = (boatState.heading - dragonHeading) % (Math.PI * 2);
  if (dh > Math.PI) dh -= Math.PI * 2; else if (dh < -Math.PI) dh += Math.PI * 2;
  dragonHeading += dh * (1 - Math.exp(-2.5 * dt));
  const ch = Math.cos(dragonHeading), sh = Math.sin(dragonHeading);
  /* advance along the racetrack at constant speed; local -> world uses the
     boat's own frame: forward (sin h, cos h), starboard (cos h, -sin h) */
  dragonS += DRAGON_SPEED * dt;
  const inCap = dragonTrackPoint(dragonS, _dLocal);
  dragonTrackPoint(dragonS + 3, _dLocalN);      // a point a moment further along — the look target
  const y = DRAGON_H + Math.sin(lt * 0.34) * DRAGON_DIVE;   // ~18 s dive cycle — unhurried
  const yNext = DRAGON_H + Math.sin((lt + 1.2) * 0.34) * DRAGON_DIVE;   // height a moment ahead: aiming at it pitches the body — down to dive in, up to come out
  dragonG.position.set(
    _dCenter.x + _dLocal.x * ch + _dLocal.y * sh,
    y,
    _dCenter.z - _dLocal.x * sh + _dLocal.y * ch
  );
  _dNext.set(
    _dCenter.x + _dLocalN.x * ch + _dLocalN.y * sh,
    yNext,
    _dCenter.z - _dLocalN.x * sh + _dLocalN.y * ch
  );
  dragonG.lookAt(_dNext);               // object +z toward travel
  dragonG.rotateY(DRAGON_HEADING_OFFSET);
  /* bank into the caps, near-level on the straights */
  dragonBank += ((inCap ? 0.32 : 0.04) - dragonBank) * Math.min(1, dt * 3);
  dragonG.rotateZ(dragonBank);
}

loadBoat().catch(e => {
  window.__boatStatus = 'load-failed';
  console.error('[prabha1] boat load failed', e);
  const s = document.querySelector('#veil .s');
  if (s) s.textContent = 'the boat could not be loaded — ' + (e && e.message ? e.message : e);
});

renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  wt += dt;
  step(dt, wt);
  updateDragon(wt, dt);
  waterMesh.material.uniforms.time.value += dt * 0.5;   // folio's timeScale
  renderer.render(scene, camera);
  window.__frames++;
});
</script>
